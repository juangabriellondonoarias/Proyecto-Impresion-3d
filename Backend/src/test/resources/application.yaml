# Las pruebas usan H2 en memoria con modo MySQL: no necesitan MySQL encendido ni tocan tus datos.
# Flyway ejecuta las mismas migraciones que en producción, así también se prueban los scripts SQL.
spring:
  datasource:
    url: "jdbc:h2:mem:costos-prueba;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1"
    username: sa
    password: ""

# Las pruebas no hacen copias automáticas ni tocan la carpeta de respaldos real.
aplicacion:
  respaldo:
    habilitado: false
    carpeta: target/respaldos-prueba
