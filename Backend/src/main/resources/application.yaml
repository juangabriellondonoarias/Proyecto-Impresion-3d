spring:
  application:
    name: costos

  # Lee las variables de Backend/.env (usuario, contraseña, puertos). Ver .env.example.
  # Una variable de entorno del sistema con el mismo nombre tiene prioridad sobre el .env.
  config:
    import: "optional:file:.env[.properties]"

  # Base de datos MySQL. La base se crea sola si no existe.
  datasource:
    url: "jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:costos3d}?createDatabaseIfNotExist=true&serverTimezone=America/Bogota&characterEncoding=UTF-8"
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  # Las tablas las crea y versiona Flyway (src/main/resources/db/migration), no Hibernate.
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: always

aplicacion:
  cors:
    # Orígenes del frontend permitidos, separados por coma.
    origenes: ${CORS_ORIGENES:http://localhost:4200}
  # Copias de seguridad de MySQL (Backend/respaldos). Ver RespaldoServicio.
  respaldo:
    habilitado: ${RESPALDO_HABILITADO:true}
    carpeta: ${RESPALDO_CARPETA:respaldos}
    mysqldump: ${RESPALDO_MYSQLDUMP:mysqldump}
    conservar: ${RESPALDO_CONSERVAR:30}
    # segundo minuto hora día mes día-semana (hora de Colombia). Por defecto: todos los días a las 9:00 p. m.
    cron: "${RESPALDO_CRON:0 0 21 * * *}"
    al-arrancar: true
